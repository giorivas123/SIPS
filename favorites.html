<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - SIPS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="content">
    <!-- Favorites (Trash) -->
    <section class="favorites-trash">
      <header>
        <h1>Favorites (Trash)</h1>
        <button class="delete-btn">Permanently Delete</button>
      </header>
      <div class="favorites-list">
        <div class="favorite-item">
          <img src="images/coffee-shop.jpg" alt="XO Coffee" class="favorite-image">
          <div class="favorite-info">
            <h3>XO Coffee</h3>
            <p>New! - XO Coffee</p>
          </div>
          <button class="delete-icon">🗑️</button>
        </div>
        <!-- Add more items as needed -->
      </div>
    </section>

    <!-- Favorites (Hearts) -->
    <section class="favorites-hearts">
      <header>
        <h1>Favorites (Hearts)</h1>
      </header>
      <div class="favorites-list">
        <div class="favorite-item">
          <img src="images/milk-tea-cafe.jpg" alt="Milk Tea Cafe" class="favorite-image">
          <div class="favorite-info">
            <h3>Milk Tea Cafe</h3>
            <p>Refreshing tea, always</p>
          </div>
          <button class="heart-icon">❤️</button>
        </div>
        <div class="favorite-item">
          <img src="images/premium-matcha.jpg" alt="Premium Matcha Maiko" class="favorite-image">
          <div class="favorite-info">
            <h3>Premium Matcha Maiko</h3>
            <p>Our top matcha blend!</p>
          </div>
          <button class="heart-icon">❤️</button>
        </div>
        <!-- Add more items as needed -->
      </div>
    </section>
  </div>
