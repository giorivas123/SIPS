<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - SIPS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Content (Initially Hidden) -->
  <div id="content">
    <header class="header">
      <div class="logo">
        <img src="images/sips-logo.png" alt="SIPS Logo" class="logo-image">
      </div>
      <div class="search-bar">
        <input type="text" placeholder="Search">
      </div>
    </header>

    <!-- Feed Section -->
    <div class="feed">
      <h1>Welcome! </h1>

      <!-- Post 1 -->
      <div class="post">
        <div class="post-header">
          <img class="user-avatar" src="images/user-profile.jpg" alt="User Avatar">
          <div class="user-info">
            <h3><a href="profile.html">J.Doe</a></h3>
            <p>#MorningVibes</p>
          </div>
        </div>
        <img class="post-image" src="images/coffee.jpg" alt="Coffee Post">
        <div class="post-actions">
          <button class="like-btn">❤️</button>
          <button class="comment-btn">💬</button>
        </div>
        <p class="post-description">A touch of artistry in every cup. ☕️ #MorningVibes #SIPS</p>
      </div>

      <!-- Post 2 -->
      <div class="post">
        <div class="post-header">
          <img class="user-avatar" src="images/user-avatar2.jpg" alt="User Avatar">
          <div class="user-info">
            <h3><a href="business-profile.html">haancoffeeroasters</a></h3>
            <p>#CoffeeTime</p>
          </div>
        </div>
        <img class="post-image" src="images/tea.jpg" alt="Tea Post">
        <div class="post-actions">
          <button class="like-btn">❤️</button>
          <button class="comment-btn">💬</button>
        </div>
        <p class="post-description">A calming brew for the perfect reset. 🍵 #TeaTime #Relaxation</p>
      </div>
    </div>
  </div>

  <!-- Footer with Bottom Navigation Bar -->
  <footer>
    <nav class="bottom-nav">
      <ul>
        <li><a href="home.html">
            <span class="icon">🏠</span>
            <span>Home</span>
          </a></li>
        <li><a href="favorites.html">
            <span class="icon">⭐</span>
            <span>Favorites</span>
          </a></li>
        <li><a href="maps.html">
            <span class="icon">🗺️</span>
            <span>Map</span>
          </a></li>
        <li><a href="drinkdiary.html">
            <span class="icon">🍹</span>
            <span>Drink Diary</span>
          </a></li>
        <li><a href="profile.html">
            <span class="icon">👤</span>
            <span>Profile</span>
          </a></li>
      </ul>
    </nav>
  </footer>

  <script src="app.js"></script>

</body>
</html>
